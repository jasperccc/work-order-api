services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: work_order_test
      POSTGRES_USER: work_order_test
      POSTGRES_PASSWORD: work_order_test_password
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U work_order_test -d work_order_test
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
